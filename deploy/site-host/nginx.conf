# RemBrowse download site. Cloudflare terminates HTTPS and reaches this server through the
# stack's tunnel (see docker-compose.yml).
#
# Caching: the page, update.json and the APKs keep their names from one version to the next, so
# they are always revalidated (ETag / Last-Modified) instead of being served stale; the app asks
# for update.json with no-cache and a changing query string as well. Fonts and images under
# assets/ may be kept for a day (the first matching pattern below wins, so CSS and JS don't).

map $uri $rembrowse_file_cache {
    default        "no-cache, no-transform";
    ~\.(css|js)$   "no-cache, no-transform";
    ~^/assets/     "public, max-age=86400, no-transform";
    ~\.png$        "public, max-age=86400, no-transform";
}

# Pages search engines must not index: the update manifest, the VirusTotal result and the keyboard test page. An empty
# value sends no header.
map $uri $rembrowse_robots {
    default         "";
    /update.json    "noindex";
    /virustotal.json "noindex";
    /keys.html      "noindex";
}

# Only a successful response may be kept; an error (a missing file, say) is always rechecked.
# no-transform everywhere: Cloudflare then leaves the HTML as sent (it injects its analytics
# beacon into pages otherwise, which the CSP blocks and the page promises not to have).
map $status $rembrowse_cache_control {
    default  "no-cache, no-transform";
    200      $rembrowse_file_cache;
    206      $rembrowse_file_cache;
    304      $rembrowse_file_cache;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Redirects (such as /assets to /assets/) say only the path, never this server's own address
    absolute_redirect off;
    charset utf-8;
    charset_types text/css application/javascript application/json;
    sendfile on;
    tcp_nopush on;
    gzip on;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Log the visitor's address that Cloudflare passes on, not the tunnel container's
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;

    # Set here only: a location with its own add_header would drop all of these
    add_header Cache-Control $rembrowse_cache_control always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Robots-Tag $rembrowse_robots always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Working files of the publish script and anything else hidden
    location ~ /\. {
        return 404;
    }

    # nginx's own type list has no entry for Android packages
    location ~ \.apk$ {
        types { }
        default_type application/vnd.android.package-archive;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

# www.rembrowse.com goes to the one address, path and query kept
server {
    listen 8080;
    server_name www.rembrowse.com;
    server_tokens off;
    add_header Cache-Control "no-cache" always;
    return 301 https://rembrowse.com$request_uri;
}
