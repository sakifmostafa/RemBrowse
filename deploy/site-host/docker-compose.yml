# RemBrowse download site (https://rembrowse.com/): nginx serving the web root that
# scripts/publish-to-site.sh fills, reachable from the internet only through this stack's own
# Cloudflare Tunnel, which also provides HTTPS.
#
#   cd deploy/site-host && docker compose up -d
#
# The web root defaults to ~/RemBrowse/www (REMBROWSE_WWW overrides it) and is mounted read-only.
# The tunnel token comes from ./.env (mode 0600, gitignored): TUNNEL_TOKEN=...
# Nothing uses host networking. Port 8474 is bound to 127.0.0.1 only, for local checks.

name: rembrowse-site

services:
  web:
    image: nginxinc/nginx-unprivileged:1.28.2-alpine
    container_name: rembrowse-site-web
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Not created when missing: Docker would make it owned by root, and publishing would fail
      - type: bind
        source: ${REMBROWSE_WWW:-/home/user/RemBrowse/www}
        target: /usr/share/nginx/html
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:8474:8080"
    networks:
      - site
    mem_limit: 128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      com.centurylinklabs.watchtower.enable: "false"

  tunnel:
    image: cloudflare/cloudflared:2026.7.1
    container_name: rembrowse-site-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --metrics 127.0.0.1:20241 run
    read_only: true
    tmpfs:
      - /tmp
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in deploy/site-host/.env}
    depends_on:
      web:
        condition: service_healthy
    networks:
      - site
    mem_limit: 128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:20241", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      com.centurylinklabs.watchtower.enable: "false"

networks:
  site: {}
